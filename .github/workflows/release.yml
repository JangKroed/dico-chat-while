name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: npm test
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v6
        with:
          name: extension-zip
          path: dist/*.zip
  updater-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: python3 tests/updater/fixtures.py /tmp/dico-fixtures
      - run: swiftc updater/Core.swift tests/updater/Tests.swift -o /tmp/dico-updater-tests && /tmp/dico-updater-tests /tmp/dico-fixtures
      - run: bash scripts/build-updater-macos.sh
      - uses: actions/upload-artifact@v6
        with:
          name: updater-macos
          path: dist/dico-updater-macos.zip
  updater-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: ./scripts/build-updater-windows.ps1
        shell: powershell
      - uses: actions/upload-artifact@v6
        with:
          name: updater-windows
          path: dist/dico-updater-windows.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, updater-macos, updater-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Validate version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'if(process.env.RELEASE_TAG !== "v"+require("./manifest.json").version)process.exit(1)'
      - uses: actions/download-artifact@v7
        with:
          name: extension-zip
          path: dist
      - uses: actions/download-artifact@v7
        with:
          pattern: updater-*
          merge-multiple: true
          path: dist
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: python3 scripts/release-notes.py > release-notes.md
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.zip --verify-tag --notes-file release-notes.md
  notify:
    needs: [verify, updater-macos, updater-windows, release]
    if: ${{ always() && needs.verify.result == 'success' && needs['updater-macos'].result == 'success' && needs['updater-windows'].result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Notify Discord build channel
        env:
          DISCORD_BUILD_WEBHOOK: ${{ secrets.DISCORD_BUILD_WEBHOOK }}
        run: python3 scripts/notify-discord.py
