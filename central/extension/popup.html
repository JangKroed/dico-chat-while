<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DICO 중앙관리 실행기</title><link rel="stylesheet" href="popup.css"></head><body>
<header><span class="mark">D</span><div><strong>DICO</strong><small>이 브라우저의 중앙관리 연결</small></div><span id="badge">확인 중</span></header>
<main><p id="status" role="status">연결 상태를 확인하고 있습니다.</p><section><h1>먼저 기존 실행기를 확인하세요</h1><p>새 중앙 실행기는 기존 교대 공지 확장과 별개입니다. 같은 계정의 기존 자동 발송을 함께 실행하지 마세요.</p><label><input type="radio" name="legacy" value="fresh"> 기존 실행기를 사용하지 않는 새 설정</label><label><input type="radio" name="legacy" value="legacy-stopped"> 기존 실행기 중지·비활성화 및 미확인 결과 해소 완료</label><button id="declare" class="secondary">확인 상태 저장</button><small>이 선택은 사용자의 확인 기록입니다. 다른 확장의 종료를 자동 검증했다는 뜻은 아닙니다.</small></section>
<button id="connect" class="secondary">관리 프로그램 다시 연결</button><button id="bind">현재 Discord 채널 연결</button><button id="open" class="secondary">중앙관리 페이지 열기</button><button id="stop" class="danger">이 브라우저 긴급 중지</button><p id="notice" role="alert"></p><footer>전송은 연결된 전용 창에서 진행됩니다.<br>메시지·순서·기록은 중앙관리 페이지에서 관리하세요.</footer></main><script type="module" src="popup.js"></script></body></html>
